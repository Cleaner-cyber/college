<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>trailer</title>
<!-- 与游戏同款的场景字体（项目依赖 lxgw-wenkai-lite-webfont，按 unicode-range 切片本地加载） -->
<link rel="stylesheet" href="../node_modules/lxgw-wenkai-lite-webfont/lxgwwenkailite-regular.css">
<link rel="stylesheet" href="../node_modules/lxgw-wenkai-lite-webfont/lxgwwenkailite-bold.css">
<style>
  /* 色彩令牌：与 tailwind.config.js / docs/04 保持一致 */
  :root {
    --paper: #F7F5F0; --card: #FFFFFF; --ink: #1C1B18; --ink-soft: #6B675E; --line: #E4E0D6;
    --accent: #C05A32; --accent-deep: #A84A27; --accent-soft: #F3E4DC;
    --dusk: #26180F; --dusk-2: #3A2415; --cream: #F6E7CC; --cream-soft: #CBB394;
    --ember: #FFB35C; --milk: #FFFBF0; --parchment: #F7EDD9; --line-warm: #E7D8BC;
  }
  html, body { margin: 0; background: #000; }
  #stage {
    position: relative; overflow: hidden;
    font-family: 'LXGW WenKai Lite', 'Songti SC', serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .abs { position: absolute; }
  .paper { background: var(--paper); }
  /* 信纸：极淡横格 + 两处暖色弥散光斑（opacity ≤ 0.07，同 index.css 氛围层） */
  .paper::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 600px at 12% 18%, rgba(192, 90, 50, 0.06), transparent 70%),
      radial-gradient(800px 700px at 88% 86%, rgba(217, 179, 106, 0.07), transparent 70%),
      repeating-linear-gradient(180deg, transparent 0 63px, rgba(28, 27, 24, 0.035) 63px 64px);
  }
  .paper::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.42  0 0 0 0 0.40  0 0 0 0 0.36  0 0 0 0.10 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .dusk {
    background:
      radial-gradient(1100px 700px at 50% 38%, rgba(255, 179, 92, 0.11), transparent 70%),
      var(--dusk);
  }
  .cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame {
    position: absolute; overflow: hidden; border-radius: 18px;
    box-shadow: 0 24px 60px rgba(10, 5, 2, 0.45), 0 0 0 1px rgba(246, 231, 204, 0.10);
    background: var(--dusk);
  }
  .frame.light { box-shadow: 0 24px 60px rgba(28, 27, 24, 0.20), 0 0 0 1px rgba(28, 27, 24, 0.06); background: var(--card); }
  .kb { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; }
  .kicker { letter-spacing: 0.32em; color: var(--accent); white-space: nowrap; }
  .dusk .kicker, .ondark .kicker { color: var(--ember); }
  .head { font-weight: 700; line-height: 1.32; white-space: pre-line; letter-spacing: 0.02em; }
  .sub { line-height: 1.6; white-space: pre-line; color: var(--ink-soft); }
  .ondark .head { color: var(--cream); }
  .ondark .sub { color: var(--cream-soft); }
  .chip {
    display: inline-flex; align-items: center; gap: 0.45em; white-space: nowrap;
    padding: 0.32em 0.9em; border-radius: 999px;
    background: rgba(255, 179, 92, 0.14); color: var(--ember);
    border: 1px solid rgba(255, 179, 92, 0.45);
  }
  .seal {
    position: absolute; border-radius: 50%; background: var(--accent); color: var(--milk);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    box-shadow: 0 0 0 6px rgba(168, 74, 39, 0.25), 0 10px 30px rgba(168, 74, 39, 0.30);
  }
  .print {
    position: absolute; box-sizing: border-box; background: var(--card); padding: 12px; border-radius: 12px;
    box-shadow: 0 2px 6px rgba(28, 27, 24, 0.06), 0 14px 36px rgba(28, 27, 24, 0.16);
  }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
  .print .tag {
    position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%);
    background: var(--accent); color: var(--milk); padding: 4px 14px; border-radius: 999px;
    font-size: 22px; white-space: nowrap; box-shadow: 0 6px 16px rgba(168, 74, 39, 0.3);
  }
  .scrim { position: absolute; inset: 0; pointer-events: none; }
  .caret { color: var(--ember); }
  .node { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); }
  .node-label { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .pill {
    display: inline-block; padding: 0.35em 1.1em; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); letter-spacing: 0.04em;
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif; font-weight: 600;
  }
  #fontwarm { position: absolute; left: -99999px; top: 0; white-space: pre; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="fontwarm"></div>
<script src="trailer.js"></script>
</body>
</html>
