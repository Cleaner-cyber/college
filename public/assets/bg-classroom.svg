<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EADA"/>
      <stop offset="1" stop-color="#E9DFC9"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#51654F"/>
      <stop offset="1" stop-color="#455943"/>
    </linearGradient>
    <linearGradient id="winlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF3D9" stop-opacity="0"/>
      <stop offset="1" stop-color="#FBF3D9" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="dayGlow" cx="0.88" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#FBEFC9" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#F8E8B8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F8E8B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.46" r="0.85">
      <stop offset="0.62" stop-color="#3A2E24" stop-opacity="0"/>
      <stop offset="1" stop-color="#3A2E24" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#wall)"/>

  <!-- ceiling -->
  <rect x="0" y="0" width="1600" height="88" fill="#E4DAC3"/>
  <rect x="0" y="84" width="1600" height="8" fill="#D6C9AC"/>
  <rect x="240" y="34" width="300" height="20" rx="10" fill="#FBF8EE" stroke="#D6C9AC" stroke-width="3"/>
  <rect x="860" y="34" width="300" height="20" rx="10" fill="#FBF8EE" stroke="#D6C9AC" stroke-width="3"/>
  <!-- projector on ceiling -->
  <rect x="652" y="30" width="96" height="40" rx="8" fill="#8A8272"/>
  <circle cx="736" cy="50" r="10" fill="#5C564A"/>

  <!-- wall clock -->
  <circle cx="180" cy="170" r="38" fill="#FDFCF9" stroke="#8A8272" stroke-width="6"/>
  <line x1="180" y1="170" x2="180" y2="146" stroke="#3A362E" stroke-width="5" stroke-linecap="round"/>
  <line x1="180" y1="170" x2="198" y2="180" stroke="#3A362E" stroke-width="4" stroke-linecap="round"/>
  <circle cx="180" cy="170" r="4" fill="#C05A32"/>

  <!-- chalkboard -->
  <rect x="266" y="128" width="754" height="404" rx="8" fill="#B08D5F"/>
  <rect x="282" y="144" width="722" height="360" rx="4" fill="url(#board)"/>
  <!-- chalk tray -->
  <rect x="258" y="532" width="770" height="16" rx="6" fill="#A3814F"/>
  <rect x="420" y="524" width="52" height="10" rx="5" fill="#FBF8EE"/>
  <rect x="500" y="524" width="40" height="10" rx="5" fill="#E9C46A"/>
  <rect x="760" y="522" width="90" height="14" rx="4" fill="#8A8272"/>
  <!-- erased smudges -->
  <ellipse cx="640" cy="330" rx="120" ry="70" fill="#DFE5D8" opacity="0.08"/>
  <ellipse cx="880" cy="240" rx="90" ry="56" fill="#DFE5D8" opacity="0.07"/>
  <!-- chalk writing -->
  <g fill="#E8E4D5" opacity="0.85" font-family="Georgia, 'Times New Roman', serif">
    <text x="330" y="220" font-size="40" font-style="italic">f(x) = x² + 2x + 1</text>
    <text x="330" y="292" font-size="34" font-style="italic">lim  (1 + 1/n)ⁿ = e</text>
    <text x="356" y="326" font-size="20" font-style="italic">n→∞</text>
    <text x="700" y="420" font-size="38" font-style="italic">∑ aₙ</text>
  </g>
  <g stroke="#E8E4D5" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.75">
    <path d="M340 380 q60 -70 120 0 q60 70 120 0"/>
    <path d="M330 452 h250"/>
    <path d="M820 300 l70 0 M876 286 l14 14 l-14 14"/>
    <circle cx="900" cy="410" r="34"/>
    <path d="M900 410 l24 -24 M900 410 l0 34"/>
  </g>
  <g stroke="#E8E4D5" stroke-width="3" fill="none" opacity="0.35" stroke-linecap="round">
    <path d="M470 470 h90 M580 470 h40"/>
  </g>

  <!-- projection screen (right of board, pulled down) -->
  <rect x="1052" y="96" width="18" height="14" fill="#8A8272"/>
  <rect x="1334" y="96" width="18" height="14" fill="#8A8272"/>
  <rect x="1040" y="88" width="324" height="26" rx="8" fill="#6E685A"/>
  <rect x="1052" y="114" width="300" height="378" fill="#FBF9F1"/>
  <rect x="1052" y="114" width="300" height="378" fill="none" stroke="#D6CDB6" stroke-width="4"/>
  <path d="M1052 114 L 1352 114 L 1352 300 Z" fill="#F1ECDC" opacity="0.6"/>
  <rect x="1052" y="492" width="300" height="18" rx="6" fill="#8A8272"/>
  <rect x="1188" y="510" width="28" height="12" rx="5" fill="#6E685A"/>

  <!-- windows far right -->
  <rect x="1428" y="108" width="172" height="440" fill="#C9BB9C"/>
  <rect x="1444" y="124" width="140" height="190" fill="#FBF3D9"/>
  <rect x="1444" y="334" width="140" height="190" fill="#F6ECC9"/>
  <rect x="1444" y="314" width="140" height="20" fill="#C9BB9C"/>
  <!-- light shaft from window -->
  <polygon points="1428,140 1600,140 1600,700 1130,700" fill="url(#winlight)" opacity="0.35"/>

  <!-- podium -->
  <g>
    <path d="M560 470 L 780 470 L 764 640 L 576 640 Z" fill="#B8935F"/>
    <path d="M560 470 L 780 470 L 776 496 L 564 496 Z" fill="#C9A87B"/>
    <g transform="rotate(-3 660 440)">
      <rect x="606" y="396" width="112" height="72" rx="6" fill="#5C564A"/>
      <rect x="614" y="404" width="96" height="56" rx="4" fill="#6E685A"/>
      <circle cx="662" cy="432" r="9" fill="#8A8272"/>
      <rect x="598" y="464" width="128" height="10" rx="4" fill="#8A8272"/>
    </g>
    <rect x="736" y="452" width="20" height="34" rx="8" fill="#7FA3B8"/>
    <ellipse cx="670" cy="656" rx="130" ry="14" fill="#3A2E24" opacity="0.14"/>
  </g>

  <!-- tiered seating -->
  <!-- row 3 (back/nearest, mostly under dialogue box) -->
  <rect x="0" y="760" width="1600" height="140" fill="#A3814F"/>
  <rect x="0" y="748" width="1600" height="18" fill="#C9A87B"/>
  <!-- row 2 -->
  <rect x="0" y="680" width="1600" height="70" fill="#B08D5F"/>
  <rect x="0" y="668" width="1600" height="16" fill="#D2B187"/>
  <g fill="#8F6F45">
    <rect x="60" y="686" width="200" height="56" rx="8"/>
    <rect x="290" y="686" width="200" height="56" rx="8"/>
    <rect x="520" y="686" width="200" height="56" rx="8"/>
    <rect x="750" y="686" width="200" height="56" rx="8"/>
    <rect x="980" y="686" width="200" height="56" rx="8"/>
    <rect x="1210" y="686" width="200" height="56" rx="8"/>
    <rect x="1440" y="686" width="160" height="56" rx="8"/>
  </g>
  <!-- row 1 (front) desk strip -->
  <rect x="0" y="600" width="1600" height="58" fill="#BE9A68"/>
  <rect x="0" y="592" width="1600" height="12" fill="#D8BC90"/>
  <g fill="#9A7850">
    <rect x="120" y="606" width="180" height="44" rx="7"/>
    <rect x="330" y="606" width="180" height="44" rx="7"/>
    <rect x="540" y="606" width="180" height="44" rx="7"/>
    <rect x="860" y="606" width="180" height="44" rx="7"/>
    <rect x="1070" y="606" width="180" height="44" rx="7"/>
    <rect x="1300" y="606" width="180" height="44" rx="7"/>
  </g>

  <!-- students (back view) on front row -->
  <g fill="#3A362E">
    <g>
      <circle cx="240" cy="540" r="26"/>
      <path d="M198 604 C 200 566, 216 552, 240 552 C 264 552, 280 566, 282 604 Z"/>
    </g>
    <g opacity="0.95">
      <circle cx="452" cy="548" r="24"/>
      <circle cx="474" cy="530" r="11"/>
      <path d="M414 604 C 416 570, 430 558, 452 558 C 474 558, 488 570, 490 604 Z"/>
    </g>
    <g>
      <circle cx="960" cy="538" r="27"/>
      <path d="M916 604 C 918 566, 935 550, 960 550 C 985 550, 1002 566, 1004 604 Z"/>
      <!-- raised hand holding pen -->
      <path d="M994 566 C 1010 548, 1018 528, 1020 506" stroke="#3A362E" stroke-width="13" fill="none" stroke-linecap="round"/>
      <rect x="1014" y="482" width="8" height="26" rx="4" fill="#C05A32"/>
    </g>
    <g opacity="0.9">
      <circle cx="1350" cy="546" r="24"/>
      <path d="M1314 604 C 1316 570, 1330 556, 1350 556 C 1370 556, 1384 570, 1386 604 Z"/>
    </g>
  </g>
  <!-- desk-top details in front row -->
  <g>
    <!-- open notebook -->
    <g transform="rotate(-2 610 612)">
      <rect x="548" y="600" width="124" height="26" rx="4" fill="#FDFCF9"/>
      <line x1="610" y1="600" x2="610" y2="626" stroke="#D6CDB6" stroke-width="3"/>
      <path d="M558 608 h40 M558 616 h36 M620 608 h40 M620 616 h30" stroke="#C9BFA6" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- milk tea cup -->
    <path d="M756 574 L 762 622 L 790 622 L 796 574 Z" fill="#E3C49A"/>
    <ellipse cx="776" cy="574" rx="20" ry="6" fill="#F1DDBE"/>
    <line x1="780" y1="546" x2="772" y2="580" stroke="#C05A32" stroke-width="5" stroke-linecap="round"/>
    <circle cx="770" cy="612" r="3.4" fill="#5C4A38"/><circle cx="780" cy="614" r="3.4" fill="#5C4A38"/><circle cx="775" cy="605" r="3.4" fill="#5C4A38"/>
    <!-- phone lying on desk -->
    <rect x="1096" y="606" width="58" height="26" rx="6" fill="#2A241D" transform="rotate(6 1125 619)"/>
    <!-- water bottle -->
    <rect x="1262" y="562" width="26" height="58" rx="9" fill="#7FA3B8"/>
    <rect x="1266" y="552" width="18" height="14" rx="4" fill="#5C7B8E"/>
  </g>
  <!-- backpack hanging on seat -->
  <g transform="rotate(4 96 656)">
    <rect x="70" y="614" width="52" height="66" rx="16" fill="#5C6B57"/>
    <rect x="80" y="628" width="32" height="22" rx="8" fill="#4A5847"/>
    <path d="M84 614 q12 -14 24 0" stroke="#4A5847" stroke-width="6" fill="none"/>
  </g>

  <rect width="1600" height="900" fill="url(#dayGlow)"/>
  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
