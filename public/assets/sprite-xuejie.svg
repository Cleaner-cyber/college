    <path d="M190 346 L 184 342 M290 346 L 296 342" stroke="#2A241D" stroke-width="4" stroke-linecap="round"/>
    <!-- 腮红 -->
    <ellipse cx="186" cy="396" rx="13" ry="8" fill="#EFB79B" opacity="0.55"/>
    <ellipse cx="294" cy="396" rx="13" ry="8" fill="#EFB79B" opacity="0.55"/>
    <!-- 鼻子 + 淡定的微笑 -->
    <path d="M240 390 C 238 397, 238 402, 241 407" stroke="#2A241D" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M222 430 C 232 438, 248 438, 258 430" stroke="#2A241D" stroke-width="5" stroke-linecap="round" fill="none"/>
