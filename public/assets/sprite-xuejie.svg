    <path d="M152 350 C 136 248, 178 186, 240 184 C 302 186, 344 248, 328 350 C 326 316, 318 296, 306 284 C 310 306, 308 326, 302 340 C 296 302, 282 280, 262 272 C 266 288, 266 302, 262 312 C 240 288, 208 282, 186 292 C 180 306, 176 326, 176 344 C 168 330, 160 338, 152 350 Z" fill="#33291F"/>
    <path d="M296 214 C 322 200, 344 202, 356 216 C 344 218, 334 224, 328 232" fill="#33291F" stroke="#2A241D" stroke-width="4"/>
