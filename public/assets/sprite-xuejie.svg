    <path d="M190 330 C 200 324, 214 323, 224 327" stroke="#2A241D" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M256 327 C 266 323, 280 324, 290 330" stroke="#2A241D" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- 眼睛 -->
    <g>
      <path d="M192 354 C 198 346, 216 346, 222 354 C 222 366, 216 374, 207 374 C 198 374, 192 366, 192 354 Z" fill="#2A241D"/>
      <circle cx="213" cy="354" r="4.5" fill="#FDFCF9"/>
