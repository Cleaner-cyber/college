      <stop offset="0.65" stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#F2EEE4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECE3D0"/>
      <stop offset="1" stop-color="#E2D6BE"/>
