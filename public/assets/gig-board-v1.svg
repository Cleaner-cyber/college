    <rect x="34" y="122" width="66" height="9" fill="#D9CDB4" stroke="#1C1B18" stroke-width="0.9"/>
    <line x1="40" y1="131" x2="40" y2="158" stroke="#1C1B18" stroke-width="0.9"/>
    <line x1="94" y1="131" x2="94" y2="158" stroke="#1C1B18" stroke-width="0.9"/>
    <rect x="262" y="122" width="66" height="9" fill="#D9CDB4" stroke="#1C1B18" stroke-width="0.9"/>
    <line x1="268" y1="131" x2="268" y2="158" stroke="#1C1B18" stroke-width="0.9"/>
    <line x1="322" y1="131" x2="322" y2="158" stroke="#1C1B18" stroke-width="0.9"/>
    <!-- startle marks -->
    <line x1="152" y1="52" x2="144" y2="41" stroke="#1C1B18" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="180" y1="47" x2="180" y2="34" stroke="#1C1B18" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="208" y1="52" x2="216" y2="41" stroke="#1C1B18" stroke-width="1.6" stroke-linecap="round"/>
