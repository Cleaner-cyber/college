    <path d="M163,86 Q162,64 181,62 Q200,64 199,84 Q198,70 181,69 Q166,70 163,86" fill="#1C1B18"/>
    <path d="M197,67 Q219,56 214,90 Q210,72 195,73 Z" fill="#1C1B18"/>
    <circle cx="181" cy="86" r="19" fill="#F2E4D4" stroke="#1C1B18" stroke-width="1.3"/>
    <path d="M164,80 Q170,70 181,69 Q193,70 198,80 Q192,74 181,74 Q170,74 164,80" fill="#1C1B18"/>
    <circle cx="174" cy="88" r="1.8" fill="#1C1B18"/>
    <circle cx="189" cy="88" r="1.8" fill="#1C1B18"/>
    <ellipse cx="181.5" cy="97" rx="2.6" ry="3.4" fill="#1C1B18" opacity="0.85"/>
    <rect x="153" y="104" width="57" height="38" rx="10" fill="#3D4F6D" stroke="#1C1B18" stroke-width="1.3"/>
    <path d="M173,104 L181,113 L190,104 Z" fill="#F7F5F0" stroke="#1C1B18" stroke-width="1"/>
    <line x1="155" y1="117" x2="209" y2="117" stroke="#F7F5F0" stroke-width="2.4"/>
    <path d="M157,110 Q144,122 141,136" stroke="#1C1B18" stroke-width="9.5" fill="none" stroke-linecap="round"/>
    <path d="M157,110 Q144,122 141,136" stroke="#3D4F6D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M206,110 Q219,122 222,136" stroke="#1C1B18" stroke-width="9.5" fill="none" stroke-linecap="round"/>
    <path d="M206,110 Q219,122 222,136" stroke="#3D4F6D" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="141" cy="139" r="4.4" fill="#F2E4D4" stroke="#1C1B18" stroke-width="1"/>
    <circle cx="222" cy="139" r="4.4" fill="#F2E4D4" stroke="#1C1B18" stroke-width="1"/>
