    <text x="228" y="34" text-anchor="end" font-size="9" fill="#E8E2CE" letter-spacing="0.5">2019·高考倒计时</text>
    <line x1="152" y1="38" x2="228" y2="38" stroke="#E8E2CE" stroke-width="0.8" opacity="0.7"/>
