    <line x1="128" y1="153" x2="128" y2="190" stroke="#1C1B18" stroke-width="1.2"/>
    <line x1="234" y1="153" x2="234" y2="190" stroke="#1C1B18" stroke-width="1.2"/>
    <rect x="146" y="134" width="26" height="6" fill="#FFFFFF" stroke="#1C1B18" stroke-width="0.8"/>
