  <rect x="420" y="72" width="34" height="21" fill="#1C1B18"/>
  <text x="437" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#F7F5F0">镜2</text>

  <!-- ═══════ 镜3 · 特写 · 课桌字迹 ═══════ -->
  <rect x="802" y="72" width="360" height="196" rx="3" fill="#FBF8F1" stroke="#1C1B18" stroke-opacity="0.7" stroke-width="1.4"/>
  <g clip-path="url(#f3)" transform="translate(802,72)">
    <rect width="360" height="196" fill="#E9DFC6"/>
    <path d="M0,34 Q120,28 360,40" stroke="#CDBD97" stroke-width="1.4" fill="none" opacity="0.7"/>
    <path d="M0,88 Q180,80 360,92" stroke="#CDBD97" stroke-width="1.2" fill="none" opacity="0.6"/>
    <path d="M0,150 Q140,144 360,156" stroke="#CDBD97" stroke-width="1.4" fill="none" opacity="0.7"/>
