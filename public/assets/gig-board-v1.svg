  <text x="56" y="35" font-size="20" font-weight="700" fill="#1C1B18" letter-spacing="1">短剧《重返2019》 AI 分镜板</text>
  <text x="56" y="52" font-size="11" fill="#8A8375">女主角 2025 → 2019 穿越段落 · 共 3 镜</text>
  <text x="1164" y="35" text-anchor="end" font-size="11" fill="#6E675C">画幅 16:9 ｜ 时长 15s ｜ 客户：陈制片</text>
