<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <clipPath id="f1"><rect x="38" y="72" width="360" height="196" rx="3"/></clipPath>
    <clipPath id="f2"><rect x="420" y="72" width="360" height="196" rx="3"/></clipPath>
