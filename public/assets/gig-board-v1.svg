      <text x="168" y="88" text-anchor="middle" font-size="19" font-weight="700" fill="#5A5346" letter-spacing="2.5">一定要去更大的世界</text>
      <path d="M78,98 Q168,104 258,96" stroke="#5A5346" stroke-width="1.6" fill="none" opacity="0.8"/>
      <text x="238" y="120" text-anchor="middle" font-size="12" fill="#6A604C" letter-spacing="1">—— 2019.6.7</text>
      <path d="M60,66 l3.5,7 7.5,1 -5.5,5.5 1.5,7.5 -7,-4 -7,4 1.5,-7.5 -5.5,-5.5 7.5,-1 Z" fill="#5A5346" opacity="0.55"/>
    </g>
    <!-- tear -->
    <path d="M206,138 q4,-8 0,-12 q-4,4 0,12" fill="#AFC8D2" stroke="#8FA9B5" stroke-width="0.8"/>
    <ellipse cx="206" cy="140" rx="5" ry="2" fill="#AFC8D2" opacity="0.5"/>
    <!-- her hand：米白开衫袖口 + 左腕黑色手表（与镜1同一角色） -->
    <path d="M268,196 C262,172 262,158 252,146 L245,135 C242,129 249,124 253,130 L264,146 C266,139 273,139 274,146 L276,156 C279,151 285,152 286,157 L287,167 C290,163 295,164 296,169 L297,182 C298,191 293,196 290,196 Z" fill="#F2E4D4" stroke="#1C1B18" stroke-width="1.3"/>
    <rect x="258" y="185" width="44" height="11" rx="4" fill="#22211E"/>
    <circle cx="280" cy="190" r="6.5" fill="#D8D8D8" stroke="#1C1B18" stroke-width="1"/>
    <path d="M250,196 L254,190 Q280,182 308,190 L310,196 Z" fill="#EAE3D2" stroke="#1C1B18" stroke-width="1.2"/>
  </g>
  <rect x="802" y="72" width="34" height="21" fill="#1C1B18"/>
  <text x="819" y="87" text-anchor="middle" font-size="11" font-weight="700" fill="#F7F5F0">镜3</text>

  <!-- ═══════ 镜头信息 ═══════ -->
  <g font-size="11.5">
    <rect x="38" y="284" width="52" height="21" rx="4" fill="none" stroke="#C05A32" stroke-width="1.2"/>
    <text x="64" y="299" text-anchor="middle" fill="#C05A32" font-weight="700">近景</text>
    <text x="100" y="299" fill="#6E675C" font-size="11">0–5s ｜ 情绪：疲惫</text>
    <text x="38" y="327" fill="#1C1B18">深夜出租屋。林晚伏在工位上睡着，</text>
    <text x="38" y="345" fill="#1C1B18">手机屏幕还亮着 2025 年的日期。</text>

    <rect x="420" y="284" width="52" height="21" rx="4" fill="none" stroke="#C05A32" stroke-width="1.2"/>
    <text x="446" y="299" text-anchor="middle" fill="#C05A32" font-weight="700">中景</text>
    <text x="482" y="299" fill="#6E675C" font-size="11">5–10s ｜ 情绪：错愕</text>
    <text x="420" y="327" fill="#1C1B18">高中教室课桌前猛然惊醒，黑板角落</text>
    <text x="420" y="345" fill="#1C1B18">写着「2019·高考倒计时」。</text>

    <rect x="802" y="284" width="52" height="21" rx="4" fill="none" stroke="#C05A32" stroke-width="1.2"/>
    <text x="828" y="299" text-anchor="middle" fill="#C05A32" font-weight="700">特写</text>
    <text x="864" y="299" fill="#6E675C" font-size="11">10–15s ｜ 情绪：鼻酸</text>
    <text x="802" y="327" fill="#1C1B18">看清课桌上自己高中时留下的字迹，</text>
    <text x="802" y="345" fill="#1C1B18">指尖停在上面，眼眶发红。</text>
  </g>

  <!-- footer -->
  <line x1="36" y1="376" x2="1164" y2="376" stroke="#D9D3C7" stroke-width="1"/>
  <text x="36" y="398" font-size="10.5" fill="#8A8375">主角：林晚（22岁）· 黑色齐肩直发+右侧银色发卡 · 米白针织开衫 · 深蓝直筒牛仔裤 ｜ 光线：暖色低饱和，三格统一</text>
  <text x="1164" y="398" text-anchor="end" font-size="10.5" fill="#8A8375">AI 生成 · 角色一致性卡随格携带 · 待客户验收</text>
</svg>
