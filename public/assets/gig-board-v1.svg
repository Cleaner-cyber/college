    <path d="M208,136 Q244,110 268,138 L272,150 L206,150 Z" fill="#EAE3D2" stroke="#1C1B18" stroke-width="1.3"/>
    <rect x="140" y="134" width="118" height="17" rx="8.5" fill="#EAE3D2" stroke="#1C1B18" stroke-width="1.3"/>
    <circle cx="192" cy="114" r="24" fill="#F2E4D4" stroke="#1C1B18" stroke-width="1.3"/>
    <path d="M168,116 Q166,86 193,84 Q219,86 217,112 Q220,130 211,138 Q216,114 206,101 Q192,94 178,104 Q170,115 173,137 Q166,128 168,116" fill="#1C1B18" opacity="0.88"/>
