<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="wallS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E4942"/>
      <stop offset="0.7" stop-color="#5A544C"/>
      <stop offset="1" stop-color="#615A51"/>
    </linearGradient>
    <linearGradient id="floorS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#77644A"/>
      <stop offset="1" stop-color="#68563D"/>
    </linearGradient>
    <linearGradient id="greenscr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#87A671"/>
      <stop offset="0.5" stop-color="#7C9B68"/>
      <stop offset="1" stop-color="#6E8C5C"/>
    </linearGradient>
    <linearGradient id="softpanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6E8"/>
      <stop offset="1" stop-color="#EFE5CC"/>
    </linearGradient>
    <radialGradient id="softglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6E7BE" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F6E7BE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignS" cx="0.5" cy="0.42" r="0.9">
      <stop offset="0.55" stop-color="#17140F" stop-opacity="0"/>
      <stop offset="1" stop-color="#17140F" stop-opacity="0.24"/>
    </radialGradient>
  </defs>

  <!-- wall & floor -->
  <rect width="1600" height="900" fill="url(#wallS)"/>
  <rect x="0" y="636" width="1600" height="264" fill="url(#floorS)"/>
  <rect x="0" y="636" width="1600" height="10" fill="#59472F"/>
  <g stroke="#6B573C" stroke-width="3" opacity="0.55">
    <line x1="0" y1="716" x2="1600" y2="716"/>
    <line x1="0" y1="806" x2="1600" y2="806"/>
    <line x1="420" y1="646" x2="392" y2="716"/>
    <line x1="980" y1="716" x2="952" y2="806"/>
    <line x1="1360" y1="646" x2="1335" y2="716"/>
  </g>

  <!-- ===== green screen corner (left) ===== -->
  <g>
    <!-- backdrop stand -->
    <rect x="60" y="86" width="14" height="580" fill="#3B3833"/>
    <rect x="596" y="86" width="14" height="580" fill="#3B3833"/>
    <rect x="52" y="78" width="566" height="16" rx="8" fill="#3B3833"/>
    <!-- cloth: hangs and sweeps onto floor -->
    <path d="M92 94 h486 v470 q0 60 60 78 l-606 0 q52 -22 56 -78 z" fill="url(#greenscr)"/>
    <!-- cloth folds -->
    <g stroke="#6E8C5C" stroke-width="6" opacity="0.6" fill="none">
      <path d="M190 94 q-8 240 -4 448"/>
      <path d="M330 94 q10 250 2 460"/>
      <path d="M470 94 q-6 240 -2 452"/>
    </g>
    <path d="M92 564 q150 34 486 0 l60 78 h-606 z" fill="#739160" opacity="0.85"/>
    <!-- clips on top bar -->
    <g fill="#2E2B27">
      <rect x="150" y="80" width="22" height="30" rx="5"/>
      <rect x="330" y="80" width="22" height="30" rx="5"/>
      <rect x="500" y="80" width="22" height="30" rx="5"/>
    </g>
  </g>

  <!-- soft glow from softbox onto green screen -->
  <ellipse cx="400" cy="360" rx="330" ry="260" fill="url(#softglow)"/>

  <!-- ===== softbox light on stand (center-left, facing green screen) ===== -->
  <g>
    <!-- stand -->
    <line x1="806" y1="330" x2="806" y2="652" stroke="#33302B" stroke-width="10"/>
    <path d="M806 652 l-58 40 m58 -40 l58 40 m-58 -40 v46" stroke="#33302B" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- softbox head, angled toward screen -->
    <g transform="rotate(18 760 300)">
      <polygon points="700,250 820,262 820,350 700,362" fill="#26241F"/>
      <rect x="676" y="256" width="30" height="100" rx="6" fill="url(#softpanel)"/>
      <polygon points="700,250 676,262 676,350 700,362" fill="#F4EBD2"/>
    </g>
    <!-- knuckle -->
    <circle cx="806" cy="330" r="12" fill="#26241F"/>
    <!-- cable to floor -->
    <path d="M810 340 q46 150 8 300" fill="none" stroke="#26241F" stroke-width="5"/>
  </g>

  <!-- ===== reflector leaning on wall ===== -->
  <g>
    <ellipse cx="700" cy="600" rx="86" ry="96" fill="#D8B96A"/>
    <ellipse cx="700" cy="600" rx="70" ry="80" fill="#E7CC85"/>
    <ellipse cx="682" cy="578" rx="26" ry="34" fill="#F2E3AE" opacity="0.8"/>
  </g>

  <!-- ===== camera on tripod (center-right, pointing left) ===== -->
  <g>
    <!-- tripod -->
    <g stroke="#2B2823" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="1010" y1="430" x2="948" y2="700"/>
      <line x1="1010" y1="430" x2="1072" y2="700"/>
      <line x1="1010" y1="430" x2="1010" y2="668"/>
    </g>
    <line x1="972" y1="600" x2="1048" y2="600" stroke="#2B2823" stroke-width="6"/>
    <!-- head -->
    <rect x="986" y="404" width="48" height="30" rx="6" fill="#2B2823"/>
    <!-- pan handle -->
    <line x1="1030" y1="424" x2="1088" y2="470" stroke="#2B2823" stroke-width="8" stroke-linecap="round"/>
    <!-- camera body -->
    <rect x="944" y="344" width="140" height="72" rx="10" fill="#33302B"/>
    <!-- lens toward screen -->
    <rect x="896" y="358" width="52" height="44" rx="8" fill="#26241F"/>
    <circle cx="900" cy="380" r="17" fill="#1C1B18"/>
    <circle cx="896" cy="376" r="6" fill="#5E718A"/>
    <!-- viewfinder screen flipped out -->
    <rect x="1084" y="350" width="56" height="42" rx="5" fill="#26241F"/>
    <rect x="1090" y="356" width="44" height="30" fill="#7C9B68"/>
    <rect x="1096" y="376" width="20" height="6" fill="#5E7A4E"/>
    <!-- mic on top -->
    <rect x="962" y="330" width="70" height="12" rx="6" fill="#26241F"/>
    <!-- rec dot -->
    <circle cx="1064" cy="360" r="6" fill="#C05A32"/>
  </g>

  <!-- ===== work table with script & clapperboard (right) ===== -->
  <g>
    <!-- table -->
    <rect x="1170" y="520" width="400" height="12" fill="#8A6E4A"/>
    <rect x="1162" y="532" width="416" height="22" fill="#77593B"/>
    <rect x="1188" y="554" width="18" height="120" fill="#5E4830"/>
    <rect x="1536" y="554" width="18" height="120" fill="#5E4830"/>
    <!-- storyboard printouts -->
    <g>
      <rect x="1196" y="452" width="120" height="72" fill="#F4F0E4" transform="rotate(-4 1256 488)"/>
      <g transform="rotate(-4 1256 488)" fill="#D6CEB9">
        <rect x="1204" y="460" width="32" height="24"/>
        <rect x="1242" y="460" width="32" height="24"/>
        <rect x="1280" y="460" width="28" height="24"/>
      </g>
      <g transform="rotate(-4 1256 488)" stroke="#BFB69E" stroke-width="3" stroke-linecap="round">
        <line x1="1206" y1="496" x2="1276" y2="496"/>
        <line x1="1206" y1="508" x2="1252" y2="508"/>
      </g>
      <rect x="1318" y="458" width="118" height="66" fill="#EFEAD9" transform="rotate(3 1377 491)"/>
      <g transform="rotate(3 1377 491)" stroke="#BFB69E" stroke-width="3" stroke-linecap="round">
        <line x1="1328" y1="470" x2="1424" y2="470"/>
        <line x1="1328" y1="484" x2="1408" y2="484"/>
        <line x1="1328" y1="498" x2="1420" y2="498"/>
        <line x1="1328" y1="512" x2="1388" y2="512"/>
      </g>
      <line x1="1330" y1="470" x2="1382" y2="470" stroke="#C05A32" stroke-width="4" transform="rotate(3 1377 491)"/>
    </g>
    <!-- clapperboard -->
    <g transform="rotate(-6 1490 470)">
      <rect x="1440" y="440" width="110" height="66" rx="4" fill="#26241F"/>
      <rect x="1436" y="424" width="118" height="20" rx="4" fill="#26241F"/>
      <g>
        <polygon points="1440,426 1460,426 1448,442 1428,442" fill="#EFEAE0"/>
        <polygon points="1478,426 1498,426 1486,442 1466,442" fill="#EFEAE0"/>
        <polygon points="1516,426 1536,426 1524,442 1504,442" fill="#EFEAE0"/>
      </g>
      <g stroke="#4B463C" stroke-width="3">
        <line x1="1448" y1="458" x2="1542" y2="458"/>
        <line x1="1448" y1="476" x2="1542" y2="476"/>
        <line x1="1448" y1="494" x2="1510" y2="494"/>
      </g>
    </g>
    <!-- coffee cup -->
    <rect x="1240" y="486" width="30" height="36" rx="4" fill="#C05A32"/>
    <path d="M1270 494 q16 3 0 18" fill="none" stroke="#C05A32" stroke-width="6"/>
  </g>

  <!-- ===== director chair (far right, in front of table) ===== -->
  <g>
    <ellipse cx="1400" cy="812" rx="120" ry="16" fill="#17140F" opacity="0.18"/>
    <!-- rear legs -->
    <g stroke="#4A3928" stroke-width="10" stroke-linecap="round">
      <line x1="1340" y1="626" x2="1452" y2="808"/>
      <line x1="1460" y1="626" x2="1348" y2="808"/>
    </g>
    <!-- canvas back -->
    <rect x="1328" y="560" width="144" height="46" rx="8" fill="#B0563A"/>
    <!-- seat -->
    <polygon points="1330,676 1470,676 1458,696 1342,696" fill="#B0563A"/>
    <!-- front frame -->
    <g stroke="#5E4830" stroke-width="10" stroke-linecap="round">
      <line x1="1336" y1="556" x2="1336" y2="680"/>
      <line x1="1464" y1="556" x2="1464" y2="680"/>
    </g>
    <line x1="1348" y1="806" x2="1452" y2="806" stroke="#4A3928" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- ===== floor practicals: cables + gaffer tape ===== -->
  <g>
    <path d="M818 690 q120 40 300 24 q160 -14 300 30" fill="none" stroke="#26241F" stroke-width="6" opacity="0.85"/>
    <path d="M700 700 q80 50 210 40" fill="none" stroke="#33302B" stroke-width="5" opacity="0.8"/>
    <!-- tape crosses -->
    <g stroke="#C9A75A" stroke-width="10" opacity="0.75" stroke-linecap="round">
      <line x1="880" y1="742" x2="920" y2="762"/>
      <line x1="920" y1="742" x2="880" y2="762"/>
    </g>
    <g stroke="#C9A75A" stroke-width="9" opacity="0.6" stroke-linecap="round">
      <line x1="1180" y1="756" x2="1214" y2="774"/>
      <line x1="1214" y1="756" x2="1180" y2="774"/>
    </g>
    <!-- floor mark T under camera -->
    <g stroke="#C05A32" stroke-width="8" opacity="0.7" stroke-linecap="round">
      <line x1="540" y1="742" x2="600" y2="742"/>
      <line x1="570" y1="742" x2="570" y2="772"/>
    </g>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#vignS)"/>
</svg>
