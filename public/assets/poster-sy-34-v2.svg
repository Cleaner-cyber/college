<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E7CB"/>
      <stop offset="0.42" stop-color="#F3C287"/>
      <stop offset="0.78" stop-color="#E48F52"/>
      <stop offset="1" stop-color="#C05A32"/>
    </linearGradient>
    <radialGradient id="sunGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4DF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F7D3A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F7D3A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C2F24"/>
      <stop offset="0.55" stop-color="#33211A"/>
      <stop offset="1" stop-color="#241813"/>
    </linearGradient>
    <linearGradient id="treeInk2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26160F"/>
      <stop offset="1" stop-color="#140C07"/>
    </linearGradient>
    <linearGradient id="ground2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33200F"/>
      <stop offset="0.25" stop-color="#2A1A0F"/>
      <stop offset="1" stop-color="#150E08"/>
    </linearGradient>
    <linearGradient id="path2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A4A2C"/>
      <stop offset="1" stop-color="#2B1A10"/>
    </linearGradient>
    <radialGradient id="vign2" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.68" stop-color="#1A0F08" stop-opacity="0"/>
      <stop offset="1" stop-color="#1A0F08" stop-opacity="0.22"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6D3A2" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#F0B87E" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F0B87E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE9C2" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#F2B268" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#F2B268" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.8  0 0 0 0 0.65  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <!-- 天空：地平线下移，上三分之一干净留白 -->
  <rect width="600" height="800" fill="url(#sky2)"/>

  <!-- 近地平线的落日（悬在左翼屋脊上方） -->
  <ellipse cx="196" cy="392" rx="220" ry="110" fill="url(#sunGlow2)"/>
  <circle cx="196" cy="372" r="27" fill="#FFF6E2"/>
  <circle cx="196" cy="372" r="38" fill="url(#sunGlow2)"/>

  <!-- 薄云 -->
  <ellipse cx="420" cy="320" rx="140" ry="9" fill="#F6DCB8" opacity="0.5" filter="url(#soft2)"/>
  <ellipse cx="180" cy="352" rx="100" ry="7" fill="#F6DCB8" opacity="0.4" filter="url(#soft2)"/>

  <!-- 天空区招新标语（社团名由游戏文字层叠加） -->
  <g font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle">
    <text x="308" y="152" font-size="58" font-weight="600" letter-spacing="14" fill="#4A2C1D">秋季招新</text>
    <rect x="252" y="182" width="96" height="3" rx="1.5" fill="#C05A32" opacity="0.85"/>
    <text x="300" y="222" font-size="19" letter-spacing="3" fill="#7A4A30">9月12日—14日 · 大学生活动中心前</text>
  </g>

  <!-- 主楼剪影：下移收小，让出天空 -->
  <g fill="url(#bldg2)">
    <path d="M300 296 L304 301 L304 312 L322 312 L322 334 L332 334 L332 346 L268 346 L268 334 L278 334 L278 312 L296 312 L296 301 Z"/>
    <path d="M262 346 L338 346 L338 370 L344 370 L344 470 L256 470 L256 370 L262 370 Z"/>
    <path d="M256 394 L256 470 L118 470 L118 412 L126 412 L126 400 L250 400 L250 394 Z"/>
    <path d="M344 394 L344 470 L482 470 L482 412 L474 412 L474 400 L350 400 L350 394 Z"/>
    <path d="M282 470 L282 442 Q300 430 318 442 L318 470 Z"/>
  </g>
  <!-- 屋顶轮廓的夕照勾边 -->
  <g stroke="#F2B071" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M268 346 L268 334 L278 334 L278 312 L296 312 L296 301 L300 296 L304 301 L304 312 L322 312 L322 334 L332 334 L332 346"/>
    <path d="M118 412 L126 412 L126 400 L250 400 M350 400 L474 400 L474 412 L482 412"/>
  </g>
  <!-- 钟面 -->
  <circle cx="300" cy="327" r="8" fill="#EFC694" opacity="0.9"/>
  <circle cx="300" cy="327" r="8" fill="none" stroke="#33211A" stroke-width="1.6"/>
  <path d="M300 327 L300 321.5 M300 327 L303.5 329" stroke="#33211A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 暮色中亮起的窗 -->
  <g fill="#E89B5A">
    <g opacity="0.85">
      <rect x="140" y="418" width="10" height="15"/><rect x="168" y="418" width="10" height="15" opacity="0.5"/><rect x="196" y="418" width="10" height="15"/><rect x="224" y="418" width="10" height="15" opacity="0.4"/>
      <rect x="140" y="446" width="10" height="15" opacity="0.45"/><rect x="168" y="446" width="10" height="15"/><rect x="224" y="446" width="10" height="15"/>
    </g>
    <g opacity="0.85">
      <rect x="366" y="418" width="10" height="15" opacity="0.5"/><rect x="394" y="418" width="10" height="15"/><rect x="422" y="418" width="10" height="15"/><rect x="450" y="418" width="10" height="15" opacity="0.4"/>
      <rect x="366" y="446" width="10" height="15"/><rect x="394" y="446" width="10" height="15" opacity="0.45"/><rect x="450" y="446" width="10" height="15"/>
    </g>
    <g opacity="0.9">
      <rect x="272" y="378" width="11" height="16"/><rect x="317" y="378" width="11" height="16" opacity="0.55"/>
      <rect x="272" y="410" width="11" height="16" opacity="0.5"/><rect x="317" y="410" width="11" height="16"/>
    </g>
  </g>

  <!-- 两侧梧桐剪影（收敛，不抢天空） -->
  <g fill="url(#treeInk2)">
    <path d="M-20 620 L-20 402 Q16 380 44 400 Q84 378 100 414 Q126 402 132 434 Q110 466 116 502 Q92 534 98 570 L82 570 L82 620 Z"/>
    <path d="M620 620 L620 396 Q586 374 556 396 Q516 374 500 410 Q474 400 468 430 Q490 464 482 500 Q508 534 500 570 L518 570 L518 620 Z"/>
  </g>

  <!-- 地面与林荫道 -->
  <rect x="0" y="470" width="600" height="330" fill="url(#ground2)"/>
  <path d="M262 470 L338 470 L470 800 L130 800 Z" fill="url(#path2)" opacity="0.5"/>
  <path d="M0 470 L600 470 L600 480 Q300 490 0 480 Z" fill="#4A2C18" opacity="0.6"/>
  <ellipse cx="300" cy="500" rx="200" ry="8" fill="#D98A54" opacity="0.14" filter="url(#soft2)"/>

  <!-- 归途学生剪影 -->
  <g fill="#160D08">
    <circle cx="240" cy="514" r="4.6"/>
    <path d="M235.5 520 q4.5 -3 9 0 l1.5 16 l-2.5 0 l-1 12 l-3 0 l-0.8 -11 l-0.8 11 l-3 0 l-1 -12 l-2.5 0 Z"/>
    <circle cx="258" cy="512" r="4.2" opacity="0.92"/>
    <path d="M254 518 q4 -3 8 0 l1.5 15 l-2.4 0 l-0.9 11 l-2.8 0 l-0.7 -10 l-0.7 10 l-2.8 0 l-0.9 -11 l-2.4 0 Z" opacity="0.92"/>
  </g>

  <!-- 路灯与光斑 -->
  <g>
    <rect x="428" y="500" width="4" height="78" fill="#1E1410"/>
    <circle cx="430" cy="494" r="6" fill="#FBE3B8"/>
    <circle cx="430" cy="494" r="24" fill="url(#lampGlow2)"/>
  </g>
  <g opacity="0.85">
    <circle cx="510" cy="368" r="14" fill="url(#bokeh2)"/>
    <circle cx="62" cy="330" r="11" fill="url(#bokeh2)"/>
    <circle cx="548" cy="540" r="18" fill="url(#bokeh2)"/>
    <circle cx="96" cy="560" r="14" fill="url(#bokeh2)"/>
    <circle cx="360" cy="640" r="10" fill="url(#bokeh2)"/>
    <circle cx="452" cy="352" r="8" fill="url(#bokeh2)"/>
  </g>

  <!-- 归鸟 -->
  <g stroke="#4A2C1D" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M430 268 q7 -6 13 0 q6 -6 13 0"/>
    <path d="M470 250 q5 -5 10 0 q5 -5 10 0"/>
    <path d="M120 288 q6 -5 11 0 q5 -5 11 0"/>
  </g>

  <!-- 暗角与胶片颗粒 -->
  <rect width="600" height="800" fill="url(#vign2)"/>
  <rect width="600" height="800" filter="url(#grain2)" opacity="0.5"/>
</svg>
