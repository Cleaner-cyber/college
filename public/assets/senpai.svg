    <circle cx="48" cy="52" r="9.5" stroke-width="2.4" fill="#FDFCF9" fill-opacity="0.45"/>
    <circle cx="72" cy="52" r="9.5" stroke-width="2.4" fill="#FDFCF9" fill-opacity="0.45"/>
