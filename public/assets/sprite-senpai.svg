    <path d="M416 396 L 416 412 M431 396 L 428 414" stroke="#2A241D" stroke-width="3" stroke-linecap="round"/>
    <!-- 脖子 -->
    <path d="M214 470 L 214 522 C 230 534, 250 534, 266 522 L 266 470 Z" fill="#F6DCC8" stroke="#2A241D" stroke-width="4.5"/>
    <!-- 围巾（强调色，识别物） -->
    <path d="M180 512 C 200 494, 280 494, 300 512 C 296 534, 268 546, 240 546 C 212 546, 184 534, 180 512 Z" fill="#C05A32" stroke="#A34724" stroke-width="4"/>
    <path d="M286 534 C 296 570, 300 604, 296 640 L 264 632 C 268 600, 272 566, 272 542" fill="#C05A32" stroke="#A34724" stroke-width="4"/>
    <path d="M270 596 L 292 602" stroke="#A34724" stroke-width="4" stroke-linecap="round"/>
    <!-- 脸 -->
    <path d="M156 330 C 152 416, 186 470, 240 474 C 294 470, 328 416, 324 330 C 320 262, 288 220, 240 218 C 192 220, 160 262, 156 330 Z" fill="#F6DCC8" stroke="#2A241D" stroke-width="5"/>
    <!-- 耳朵 -->
    <path d="M152 344 C 140 340, 136 356, 144 368 C 148 374, 156 376, 160 372 Z" fill="#F6DCC8" stroke="#2A241D" stroke-width="4"/>
    <path d="M328 344 C 340 340, 344 356, 336 368 C 332 374, 324 376, 320 372 Z" fill="#F6DCC8" stroke="#2A241D" stroke-width="4"/>
