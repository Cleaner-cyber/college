    <path d="M148 344 C 134 238, 176 174, 240 172 C 304 174, 346 238, 332 344 C 330 310, 322 290, 310 278 C 314 300, 312 318, 306 332 C 300 294, 286 272, 266 264 C 270 280, 270 294, 264 306 C 242 282, 210 276, 188 286 C 182 300, 178 318, 178 336 C 170 322, 158 330, 148 344 Z" fill="#2A241D"/>
    <!-- 呆毛 -->
    <path d="M236 176 C 232 158, 240 144, 254 138 C 248 152, 250 164, 256 174" fill="#2A241D"/>
    <!-- 眉毛 -->
    <path d="M186 322 C 196 316, 210 315, 220 319" stroke="#2A241D" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <path d="M260 319 C 270 315, 284 316, 294 322" stroke="#2A241D" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- 眼睛：清亮 -->
    <g>
      <path d="M188 348 C 194 340, 212 340, 218 348 C 218 360, 212 368, 203 368 C 194 368, 188 360, 188 348 Z" fill="#2A241D"/>
      <circle cx="209" cy="348" r="4.5" fill="#FDFCF9"/>
      <path d="M262 348 C 268 340, 286 340, 292 348 C 292 360, 286 368, 277 368 C 268 368, 262 360, 262 348 Z" fill="#2A241D"/>
      <circle cx="283" cy="348" r="4.5" fill="#FDFCF9"/>
