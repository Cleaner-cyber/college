    <!-- 腮红 -->
    <ellipse cx="182" cy="392" rx="14" ry="8" fill="#EFB79B" opacity="0.55"/>
    <ellipse cx="298" cy="392" rx="14" ry="8" fill="#EFB79B" opacity="0.55"/>
    <!-- 鼻子 + 笑 -->
    <path d="M240 384 C 238 392, 238 398, 241 404" stroke="#2A241D" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M216 426 C 228 438, 252 438, 264 426" stroke="#2A241D" stroke-width="5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
