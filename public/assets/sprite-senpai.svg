    <path d="M330 580 C 366 566, 390 536, 400 498 C 414 486, 424 470, 426 452 L 396 440 C 388 458, 380 468, 368 476 C 350 500, 332 528, 316 548" fill="#3A362E" stroke="#2A241D" stroke-width="5"/>
