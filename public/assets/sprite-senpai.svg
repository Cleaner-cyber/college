    <path d="M330 760 C 332 640, 322 570, 294 532 L 266 560 C 284 640, 290 700, 290 760 Z" fill="#3A362E"/>
    <!-- 帽绳（强调色） -->
    <path d="M226 552 L 224 618 M254 552 L 256 606" stroke="#C05A32" stroke-width="7" stroke-linecap="round"/>
    <circle cx="224" cy="624" r="6" fill="#C05A32"/>
    <circle cx="256" cy="612" r="6" fill="#C05A32"/>
    <!-- 左臂自然下垂 -->
    <path d="M140 585 C 118 640, 112 690, 116 742 C 130 752, 150 752, 162 744 C 160 690, 164 646, 172 610" fill="#3A362E" stroke="#2A241D" stroke-width="5"/>
