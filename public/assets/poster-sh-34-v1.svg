    <path id="spark" d="M0,-11 C1,-4 4,-1 11,0 C4,1 1,4 0,11 C-1,4 -4,1 -11,0 C-4,-1 -1,-4 0,-11 Z"/>
    <path id="heart" d="M0,10 C-12,0 -14,-8 -8,-12 C-4,-14 0,-11 0,-7 C0,-11 4,-14 8,-12 C14,-8 12,0 0,10 Z"/>
