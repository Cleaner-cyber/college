      <path d="M92,52 q58,-4 50,-54 q-3,-22 -26,-16 q-16,5 -12,26" fill="none" stroke="#FDFBF6" stroke-width="7" stroke-linecap="round"/>
      <path d="M-70,95 C-96,58 -90,4 -60,-26 C-76,-46 -79,-70 -70,-89 C-51,-87 -37,-75 -29,-62 C-19,-66 -9,-68 0,-68 C9,-68 19,-66 29,-62 C37,-75 51,-87 70,-89 C79,-70 76,-46 60,-26 C90,4 96,58 70,95 C40,111 -40,111 -70,95 Z"
