    <use href="#cloud" transform="translate(452,190) scale(0.72)" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4"/>
    <use href="#cloud" transform="translate(66,282) scale(0.62)" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4"/>

