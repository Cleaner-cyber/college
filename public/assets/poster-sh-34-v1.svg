    <use href="#heart" transform="translate(360,686) scale(0.9) rotate(8)" fill="#D9A441"/>
    <use href="#heart" transform="translate(30,180) scale(0.8) rotate(-8)" fill="#D9A441"/>
    <use href="#heart" transform="translate(568,220) scale(0.85) rotate(12)" fill="#C05A32"/>
    <use href="#spark" transform="translate(36,66) scale(0.9)" fill="#C05A32"/>
    <use href="#spark" transform="translate(300,746) scale(0.8)" fill="#8FA37E"/>
    <use href="#spark" transform="translate(140,700) scale(0.8)" fill="#C05A32"/>
