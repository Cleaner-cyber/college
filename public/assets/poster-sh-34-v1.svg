      <path d="M0,-48 L0,-62 M34,-34 L44,-44 M48,0 L62,0 M34,34 L44,44 M0,48 L0,62 M-34,34 L-44,44 M-48,0 L-62,0 M-34,-34 L-44,-44" stroke="#1C1B18" stroke-width="4.5" stroke-linecap="round" fill="none"/>
