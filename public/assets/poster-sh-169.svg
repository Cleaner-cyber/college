<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <filter id="wob" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="wobText" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.11  0 0 0 0 0.106  0 0 0 0 0.094  0 0 0 0.5 0"/>
    </filter>

    <path id="star" d="M0,-14 L4,-4 L14,-3 L6,4 L9,14 L0,8 L-9,14 L-6,4 L-14,-3 L-4,-4 Z"/>
    <path id="spark" d="M0,-11 C1,-4 4,-1 11,0 C4,1 1,4 0,11 C-1,4 -4,1 -11,0 C-4,-1 -1,-4 0,-11 Z"/>
    <path id="heart" d="M0,10 C-12,0 -14,-8 -8,-12 C-4,-14 0,-11 0,-7 C0,-11 4,-14 8,-12 C14,-8 12,0 0,10 Z"/>
    <g id="flower">
      <circle cx="0" cy="-8" r="5.5"/><circle cx="7.6" cy="-2.5" r="5.5"/><circle cx="4.7" cy="6.5" r="5.5"/>
      <circle cx="-4.7" cy="6.5" r="5.5"/><circle cx="-7.6" cy="-2.5" r="5.5"/>
      <circle cx="0" cy="0" r="3.6" fill="#D9A441"/>
    </g>
    <g id="cloud">
      <path d="M-34,8 C-46,8 -46,-6 -34,-8 C-33,-18 -18,-21 -12,-14 C-6,-24 12,-23 16,-13 C28,-16 36,-4 28,4 C24,10 -26,11 -34,8 Z"/>
    </g>
    <g id="note">
      <path d="M2,-16 L4,6" stroke-width="3.6" fill="none"/>
      <ellipse cx="0" cy="7" rx="5.4" ry="4.2"/>
      <path d="M3,-15 q9,2 9,9" stroke-width="3.6" fill="none"/>
    </g>
    <g id="tape">
      <path d="M-46,-13 L-40,-9 L-46,-4 L-40,0 L-46,5 L-41,9 L-46,13 L46,13 L41,9 L46,4 L40,0 L46,-5 L41,-9 L46,-13 Z" opacity="0.72"/>
      <path d="M-38,-6 L38,-6 M-38,3 L38,3" stroke="#FFFFFF" stroke-width="2.4" opacity="0.5" fill="none"/>
    </g>

    <g id="cat">
      <path d="M92,52 q58,-4 50,-54 q-3,-22 -26,-16 q-16,5 -12,26" fill="none" stroke="#1C1B18" stroke-width="14" stroke-linecap="round"/>
      <path d="M92,52 q58,-4 50,-54 q-3,-22 -26,-16 q-16,5 -12,26" fill="none" stroke="#FDFBF6" stroke-width="7" stroke-linecap="round"/>
      <path d="M-70,95 C-96,58 -90,4 -60,-26 C-76,-46 -79,-70 -70,-89 C-51,-87 -37,-75 -29,-62 C-19,-66 -9,-68 0,-68 C9,-68 19,-66 29,-62 C37,-75 51,-87 70,-89 C79,-70 76,-46 60,-26 C90,4 96,58 70,95 C40,111 -40,111 -70,95 Z"
            fill="#FDFBF6" stroke="#1C1B18" stroke-width="5.5" stroke-linejoin="round"/>
      <path d="M-62,-77 C-52,-74 -45,-68 -41,-61 C-48,-58 -55,-56 -60,-57 C-63,-63 -64,-70 -62,-77 Z" fill="#EFB7A4"/>
      <path d="M62,-77 C52,-74 45,-68 41,-61 C48,-58 55,-56 60,-57 C63,-63 64,-70 62,-77 Z" fill="#EFB7A4"/>
      <ellipse cx="-26" cy="-18" rx="7.5" ry="10"/>
      <ellipse cx="26" cy="-18" rx="7.5" ry="10"/>
      <circle cx="-23.4" cy="-21.5" r="2.6" fill="#FFFFFF"/>
      <circle cx="28.6" cy="-21.5" r="2.6" fill="#FFFFFF"/>
      <path d="M-3.6,-4 L3.6,-4 L0,0.6 Z" fill="#C05A32"/>
      <path d="M-8,4 q4,6.5 8,0.5 q4,6 8,-0.5" fill="none" stroke="#1C1B18" stroke-width="3" stroke-linecap="round"/>
      <circle cx="-46" cy="0" r="9" fill="#EFB7A4" opacity="0.85"/>
      <circle cx="46" cy="0" r="9" fill="#EFB7A4" opacity="0.85"/>
      <path d="M-58,-10 L-82,-16 M-58,-2 L-84,-2 M58,-10 L82,-16 M58,-2 L84,-2" stroke="#1C1B18" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M-52,30 C-20,44 20,44 52,30 L54,44 C20,58 -20,58 -54,44 Z" fill="#C05A32" stroke="#1C1B18" stroke-width="4" stroke-linejoin="round"/>
      <path d="M30,46 L40,74 L20,72 Z" fill="#C05A32" stroke="#1C1B18" stroke-width="4" stroke-linejoin="round"/>
      <path d="M0,52 C-15,44 -40,44 -54,50 L-54,88 C-40,82 -15,82 0,90 C15,82 40,82 54,88 L54,50 C40,44 15,44 0,52 Z"
            fill="#FFFDF8" stroke="#1C1B18" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M0,52 L0,90" stroke="#1C1B18" stroke-width="3.2"/>
      <path d="M-44,58 L-12,56 M-44,66 L-12,64 M-44,74 L-12,72 M12,56 L44,58 M12,64 L44,66 M12,72 L44,74" stroke="#B9AE9C" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#F6F1E4"/>
  <rect width="1280" height="720" filter="url(#grain)" opacity="0.16"/>

  <!-- ===== left 1/3 : clean title zone ===== -->
  <g filter="url(#wob)">
    <use href="#tape" transform="translate(72,36) rotate(-32) scale(0.8)" fill="#8FA37E"/>
    <use href="#star" transform="translate(96,214) scale(0.72) rotate(-14)" fill="#C05A32"/>
    <use href="#spark" transform="translate(332,196) scale(0.9)" fill="#D9A441"/>
  </g>
  <g filter="url(#wobText)" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle">
    <text x="214" y="322" font-size="72" font-weight="700" fill="#1C1B18" letter-spacing="8" rotate="-3 3 -2 3">秋季招新</text>
    <text x="214" y="386" font-size="21" fill="#6F675A" letter-spacing="2">9.12 周五 18:30 · 大学生活动中心</text>
  </g>
  <g filter="url(#wob)">
    <path d="M62,344 q19,-10 38,0 q19,10 38,0 q19,-10 38,0 q19,10 38,0 q19,-10 38,0 q19,10 38,0 q19,-10 38,0 q19,10 38,0" fill="none" stroke="#C05A32" stroke-width="4.5" stroke-linecap="round"/>
    <use href="#heart" transform="translate(126,448) scale(0.85) rotate(-10)" fill="#C05A32"/>
    <use href="#star" transform="translate(300,452) scale(0.7) rotate(18)" fill="#D9A441"/>
    <!-- wavy hand-drawn divider -->
    <path d="M436,54 q14,26 0,52 q-14,26 0,52 q14,26 0,52 q-14,26 0,52 q14,26 0,52 q-14,26 0,52 q14,26 0,52 q-14,26 0,52 q14,26 0,52 q-14,26 0,52 q14,26 0,52 q-14,26 0,52"
          fill="none" stroke="#C8BFAB" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="14 12"/>
  </g>

  <!-- ===== right 2/3 : subject ===== -->
  <g filter="url(#wob)">
    <use href="#tape" transform="translate(1206,38) rotate(32) scale(0.8)" fill="#C05A32"/>

    <!-- sun & clouds -->
    <g transform="translate(1156,116)">
      <circle r="30" fill="#D9A441" stroke="#1C1B18" stroke-width="4.5"/>
      <path d="M0,-42 L0,-55 M30,-30 L39,-39 M42,0 L55,0 M30,30 L39,39 M-30,30 L-39,39 M-42,0 L-55,0 M-30,-30 L-39,-39" stroke="#1C1B18" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <path d="M-9,-4 q3,4 6,0 M3,-4 q3,4 6,0" stroke="#1C1B18" stroke-width="2.8" fill="none" stroke-linecap="round"/>
      <path d="M-4,5 q4,5 8,0" stroke="#1C1B18" stroke-width="2.8" fill="none" stroke-linecap="round"/>
    </g>
    <use href="#cloud" transform="translate(700,96) scale(0.9)" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4"/>
    <use href="#cloud" transform="translate(986,84) scale(0.7)" fill="#EFE6D2" stroke="#1C1B18" stroke-width="4"/>
    <use href="#cloud" transform="translate(586,236) scale(0.62)" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4"/>

    <!-- the cat, subject on the right -->
    <use href="#cat" transform="translate(870,412) scale(1.34)"/>

    <!-- speech bubble -->
    <g transform="translate(1064,258) rotate(8)">
      <ellipse rx="40" ry="29" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4.5"/>
      <path d="M-16,25 L-30,48 L-33,23" fill="#FDFBF6" stroke="#1C1B18" stroke-width="4.5" stroke-linejoin="round"/>
      <use href="#note" transform="scale(1.05)" fill="#C05A32" stroke="#C05A32"/>
    </g>

    <!-- doodles around the subject -->
    <use href="#star" transform="translate(632,362) scale(0.95) rotate(-12)" fill="#D9A441"/>
    <use href="#star" transform="translate(1120,412) scale(0.9) rotate(16)" fill="#C05A32"/>
    <use href="#star" transform="translate(688,514) scale(0.75) rotate(20)" fill="#8FA37E"/>
    <use href="#star" transform="translate(1206,318) scale(0.7) rotate(-18)" fill="none" stroke="#C05A32" stroke-width="3"/>
    <use href="#star" transform="translate(830,148) scale(0.8) rotate(12)" fill="#C05A32"/>
    <use href="#spark" transform="translate(712,286) scale(0.8)" fill="#C05A32"/>
    <use href="#spark" transform="translate(1042,170) scale(0.75)" fill="#8FA37E"/>
    <use href="#spark" transform="translate(1226,494) scale(0.85)" fill="#D9A441"/>
    <use href="#heart" transform="translate(626,436) scale(0.9) rotate(-10)" fill="#C05A32"/>
    <use href="#heart" transform="translate(1188,224) scale(0.85) rotate(10)" fill="#EFB7A4" stroke="#1C1B18" stroke-width="2.4"/>
    <use href="#heart" transform="translate(1152,528) scale(0.8) rotate(8)" fill="#C05A32"/>

    <!-- ground under the subject -->
    <path d="M508,614 Q544,594 580,614 Q616,594 652,614 Q688,594 724,614 Q760,594 796,614 Q832,594 868,614 Q904,594 940,614 Q976,594 1012,614 Q1048,594 1084,614 Q1120,594 1156,614 Q1192,594 1228,614 Q1256,600 1286,614"
          fill="none" stroke="#8FA37E" stroke-width="5" stroke-linecap="round"/>
    <use href="#flower" transform="translate(566,644) scale(0.8)" fill="#C05A32"/>
    <use href="#flower" transform="translate(1196,646) scale(0.8)" fill="#EFB7A4"/>
    <path d="M650,640 q4,-14 10,0 M1096,642 q4,-14 10,0" fill="none" stroke="#8FA37E" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- hand-written aside pointing at the cat -->
  <g filter="url(#wobText)">
    <text x="1114" y="590" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="21" fill="#C05A32" text-anchor="middle" transform="rotate(-7 1114 590)" rotate="-2 3 -2 2">等你来玩！</text>
    <path d="M1078,568 Q1052,556 1030,540" fill="none" stroke="#C05A32" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M1044,542 L1030,540 L1037,553" fill="none" stroke="#C05A32" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
