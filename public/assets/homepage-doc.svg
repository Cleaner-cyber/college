<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <clipPath id="win">
      <rect x="0" y="0" width="600" height="400" rx="12"/>
    </clipPath>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1C1B18" flood-opacity="0.06"/>
    </filter>
  </defs>

  <g clip-path="url(#win)">
    <!-- page background -->
    <rect width="600" height="400" fill="#FAF8F3"/>

    <!-- browser chrome -->
    <rect x="0" y="0" width="600" height="38" fill="#EDEAE2"/>
    <line x1="0" y1="38" x2="600" y2="38" stroke="#DDD8CC" stroke-width="1"/>
    <circle cx="20" cy="19" r="5.5" fill="#E0604F"/>
    <circle cx="38" cy="19" r="5.5" fill="#E3A63C"/>
    <circle cx="56" cy="19" r="5.5" fill="#66AE60"/>
    <rect x="78" y="8.5" width="444" height="21" rx="10.5" fill="#FFFFFF" stroke="#E1DCD0" stroke-width="1"/>
    <text x="94" y="23" font-size="11.5" fill="#807A6E" font-family="ui-monospace,Menlo,Consolas,monospace">file:///index.html</text>
    <!-- reload icon -->
    <path d="M545 14.5a5 5 0 1 1-3.6 8.4" fill="none" stroke="#9B958A" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M545 11.5v3.4h3.4z" fill="#9B958A"/>

    <!-- night button -->
    <rect x="513" y="52" width="66" height="26" rx="13" fill="#FFFFFF" stroke="#E7E2D7" stroke-width="1"/>
    <path d="M531.5 60.2a5.6 5.6 0 1 0 4.6 8.6 6.6 6.6 0 0 1-4.6-8.6z" fill="none" stroke="#4A463E" stroke-width="1.2"/>
    <text x="542" y="69.5" font-size="11.5" fill="#4A463E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">夜间</text>

    <!-- kicker -->
    <text x="60" y="94" font-size="10" fill="#C05A32" letter-spacing="4.2" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">HELLO, I AM</text>

    <!-- name -->
    <text x="58" y="139" font-size="38" font-weight="600" fill="#23221E" letter-spacing="2.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">你的名字</text>

    <!-- tagline -->
    <text x="60" y="167" font-size="13" fill="#807A6E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">刚开始大学生活，想把喜欢的事一件一件做出来。</text>

    <!-- hobby tags -->
    <g font-size="11.5" fill="#4A463E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" text-anchor="middle">
      <rect x="60" y="184" width="51" height="24" rx="12" fill="#FFFFFF" stroke="#E7E2D7" stroke-width="1"/>
      <text x="85.5" y="200">摄影</text>
      <rect x="119" y="184" width="63" height="24" rx="12" fill="#FFFFFF" stroke="#E7E2D7" stroke-width="1"/>
      <text x="150.5" y="200">羽毛球</text>
      <rect x="190" y="184" width="75" height="24" rx="12" fill="#FFFFFF" stroke="#E7E2D7" stroke-width="1"/>
      <text x="227.5" y="200">独立播客</text>
    </g>

    <!-- showcase card -->
    <g filter="url(#cardShadow)">
      <rect x="60" y="226" width="480" height="104" rx="14" fill="#FFFFFF" stroke="#E7E2D7" stroke-width="1"/>
    </g>
    <text x="84" y="256" font-size="11.5" fill="#C05A32" letter-spacing="2.5" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">拿得出手的一件事</text>
    <text x="84" y="282" font-size="13" fill="#23221E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">高三暑假自学了视频剪辑，给班级毕业礼做了一支三分钟的短片，</text>
    <text x="84" y="305" font-size="13" fill="#23221E" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">放映那天看哭了好几个人。</text>

    <!-- footer -->
    <text x="60" y="373" font-size="10.5" fill="#807A6E" letter-spacing="0.8" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">你的名字 · 这个网站由我和 AI 一起完成</text>
  </g>

  <!-- window outline -->
  <rect x="0.5" y="0.5" width="599" height="399" rx="12" fill="none" stroke="#DAD5C9" stroke-width="1"/>
</svg>
